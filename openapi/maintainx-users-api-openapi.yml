                        - 'null'
                        format: date-time
                        example: '2026-05-06T12:34:56.000Z'
                        description: When the user was added to this organization. Scoped to the organization the request is made against. `null` if the user is no longer part of the organization.
        '400':
          description: Error with query
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    description: Description of error
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Could not find the specified user or the user cannot access it.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Not Found.
      tags:
      - Users
      operationId: getUsersById
      x-operation-id-source: derived
    patch:
      summary: Update user
      parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: ID of the user
        example: '1'
      - schema:
