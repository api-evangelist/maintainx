  /assets/{assetId}/status:
    post:
      summary: Create a new asset status
      parameters:
      - schema:
          type: integer
        name: assetId
        in: path
        required: true
        description: ID of the asset
        example: '5678'
      - schema:
          type: boolean
        description: Set `skipWebhook=true`, `skipWebhook=1` or `skipWebhook=yes` to skip all webhooks upon successful operation on the endpoint. [Learn more about webhooks](#tag/Subscriptions-and-Webhooks)
        name: skipWebhook
        in: query
        required: false
      - schema:
          type: integer
        description: Required if using a multi organizations token
        name: x-organization-id
        in: header
        required: false
        example: '1'
      requestBody:
        description: Asset Status to set
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: OFFLINE
                  description: Asset status value.
                  enum:
                  - IGNORE
                  - OFFLINE
                  - ONLINE
                customStatusId:
                  type:
                  - number
                  - 'null'
                  description: Id of the custom status assigned to asset.
                  example: 53
                downtimeType:
                  type:
                  - string
                  - 'null'
                  example: PLANNED
                  enum:
                  - PLANNED
                  - UNPLANNED
                startedAt:
                  type: string
                  format: date-time
                  example: '2022-01-01T12:34:56.123Z'
                  description: Asset status effective start date.
                endedAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  example: '2022-01-01T12:34:56.123Z'
                  description: Asset status effective end date.
                description:
                  type:
                  - string
                  - 'null'
                  example: Overheated - needs servicing.
      responses:
        '201':
          description: Successfully set a new asset status
          content:
            application/json:
              schema:
                type: object
                required:
                - assetStatus
                properties:
                  assetStatus:
                    type: object
                    required:
                    - id
                    - status
                    - startedAt
                    properties:
                      id:
                        type: number
                        example: 42
                        description: Global ID of the asset status.
                      downtimeType:
                        type:
                        - string
                        - 'null'
                        example: PLANNED
                        enum:
                        - PLANNED
                        - UNPLANNED
                      status:
                        type: string
                        example: OFFLINE
