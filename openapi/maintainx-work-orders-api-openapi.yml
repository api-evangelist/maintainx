    patch:
      summary: Update work order
      parameters:
      - in: query
        name: expand
        schema:
          title: Expand specific fields in the request
          description: 'To expand multiple fields: `expand=assignees&expand=asset`'
          type: array
          items:
            type: string
            enum:
            - assignees
            - asset
            - estimated_time
            - location
            - parts
            - times
            - time_items
            - expenditures
            - extra_fields
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: ID of the work order
        example: '1'
      - schema:
          type: boolean
        description: Set `skipWebhook=true`, `skipWebhook=1` or `skipWebhook=yes` to skip all webhooks upon successful operation on the endpoint. [Learn more about webhooks](#tag/Subscriptions-and-Webhooks)
        name: skipWebhook
        in: query
        required: false
      requestBody:
        description: Update data
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  type:
                  - integer
                  - 'null'
                assignees:
                  type: array
                  description: Either the teamId, the userId or the user email address
                  items:
                    type: object
                    title: assignees
                    required:
                    - type
                    - id
                    properties:
                      type:
                        type: string
                        example: USER
                        enum:
                        - USER
                        - TEAM
                      id:
                        oneOf:
                        - type: integer
                        - type: string
                requesterId:
                  oneOf:
                  - type:
                    - integer
                    - 'null'
                  - type: string
                  description: ID or email of the user who requested the work order
                categories:
                  type: array
                  description: List of categories that identify the work order
                  items:
                    type: string
                    example: Cleaning
                    uniqueItems: true
                description:
                  type:
                  - string
                  - 'null'
                  example: A work order sample description
                dueDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Date & time at which the work order is due
                  example: '2022-01-01T00:00:00.000Z'
                estimatedTime:
                  type:
                  - integer
                  - 'null'
                  description: The estimated time taken in seconds to complete the work order
                  example: 3600
                externalData:
                  description: Extra data that can be attached to the work order, for example to help reference to a matching record in an external system.
                  oneOf:
                  - type: object
                    example:
                      popularErpSolutionId: asd732da
                  - type: number
                    example: 732
                  - type: string
                    example: asd732da
                startDate:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Date & time at which the work order will show up in the inbox</br>Only valid when <b>dueDate</b> is set
                  example: '2022-01-01T00:00:00.000Z'
                locationId:
                  type:
                  - integer
                  - 'null'
                  description: Global ID of the location assigned to the work order
                priority:
                  type: string
                  example: MEDIUM
                  enum:
                  - NONE
                  - LOW
                  - MEDIUM
                  - HIGH
                procedure:
                  type:
                  - object
                  - 'null'
                  required:
                  - title
                  - fields
                  properties:
                    id:
                      type: number
                      example: 1234
                      deprecated: true
                      description: You should favor 'procedureTemplateId' to attach a procedure template.
                    title:
                      type: string
                      description: Title of the procedure
                      example: Control dashboard audit
                    fields:
                      type: array
                      items:
                        type: object
                        required:
                        - type
                        - label
                        properties:
                          label:
                            type: string
                            example: 'Metal Parts: broken, loose, dented, rusty, missing'
                          type:
                            type: string
                            example: INSPECTION_CHECK
                            enum:
                            - NUMBER
                            - AMOUNT
                            - TEXT
                            - UNSUPPORTED
                            - HEADING
                            - FILE
                            - SIGNATURE
                            - MULTIPLE_CHOICE
                            - INSPECTION_CHECK
                            - YES_NO_NA
                            - CHECKBOX
                            - CHECKLIST
                            - METER
                            - DATE
                            - CYCLE_COUNT
                          description:
                            type:
                            - string
                            - 'null'
                          choices:
                            type: array
                            items:
                              example: Partially
                              type: string
                          urls:
                            type: array
                            items:
                              type: object
                              required:
                              - link
                              properties:
                                label:
                                  type: string
                                  description: Label of the url
                                  example: MaintainX Website
                                link:
                                  type: string
                                  description: Link
                                  example: www.getmaintainx.com
                          meterId:
                            type:
                            - number
                            - 'null'
                            example: 1
                            description: Id of the meter
                          isDateAndTime:
                            type: boolean
                            default: false
                            description: Indicate if a DATE field also contains the time
                            example: false
                          index:
                            type: number
                            example: 1
                            description: Order which the row is displayed
                      description: Steps of a procedure
