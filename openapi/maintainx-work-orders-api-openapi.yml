  /workorders/{id}/status:
    patch:
      summary: Update work order status
      parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: ID of the workOrder
        example: '1'
      - schema:
          type: boolean
        description: Set `skipWebhook=true`, `skipWebhook=1` or `skipWebhook=yes` to skip all webhooks upon successful operation on the endpoint. [Learn more about webhooks](#tag/Subscriptions-and-Webhooks)
        name: skipWebhook
        in: query
        required: false
      requestBody:
        description: Update data
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - OPEN
                  - IN_PROGRESS
                  - ON_HOLD
                  - DONE
                  - CANCELED
                  description: <br /><em>Note:</em> It is also possible to register a webhook to get notified when the status of any work order changes. Please see the <a href="#tag/Subscriptions">Subscriptions</a> section for more information.
      responses:
        '200':
          description: Successfully updated work order's status
          content:
            application/json:
              schema:
                title: WorkOrder
                type: object
                description: Work order information
                properties:
                  workOrder:
                    title: ''
                    type: object
                    required:
                    - updatedAt
                    - status
                    - title
                    - createdAt
                    - creatorId
                    - id
                    - sequentialId
                    - organizationId
                    properties:
                      id:
                        type: integer
                        description: Global ID of the work order
                      sequentialId:
                        type: integer
                        description: Organization specific ID of the work order
                      assetId:
                        type:
                        - integer
                        - 'null'
                        example: 42
                      attachments:
                        type: array
                        title: attachment
                        description: List of attachments linked to the work order
                        items:
                          type: object
                          title: attachment
                          required:
                          - id
                          - mimeType
                          - fileName
                          - url
                          - createdAt
                          properties:
                            id:
                              type: number
                              description: Global ID of the attachment
                              example: 12345
                            mimeType:
                              type: string
                              description: MIME type of the file
                              example: image/png
                            fileName:
                              type: string
                              description: Attachment's file name
                              example: image.png
                            url:
                              type: string
                              description: Url of the file. Valid for 60 minutes.
                              example: http://example.com/image.png
                            createdAt:
                              type: string
                              format: date-time
                              description: Date & time at which the attachment was uploaded
                              example: '2022-01-01T00:00:00.000Z'
                            width:
                              type:
                              - number
                              - 'null'
                              description: Width if the file is an image
                              example: 220
                            height:
                              type:
                              - number
                              - 'null'
                              description: Height if the file is an image
                              example: 100
                      categories:
                        type: array
                        description: List of categories that identify the work order
                        items:
                          type: string
                          example: Cleaning
                          uniqueItems: true
                      completedAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Date & time at which the work order was last marked as DONE
                        example: '2022-01-01T00:00:00.000Z'
                      completerId:
                        type:
                        - integer
                        - 'null'
                        description: ID of the user who completed the work order
                      createdAt:
                        type: string
                        format: date-time
                        description: Date & time at which the work order was created
                        example: '2022-01-01T00:00:00.000Z'
                      creatorId:
                        type:
                        - integer
                        - 'null'
                        description: ID of the user who created the work order
                      deletedAt:
                        type:
                        - string
