  /workorders/{id}:
    get:
      summary: Get work order
      parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: ID of the workOrder
        example: '1'
      - in: query
        name: expand
        schema:
          title: Expand specific fields in the request
          description: 'To expand multiple fields: `expand=assignees&expand=asset`'
          type: array
          items:
            type: string
            enum:
            - assignees
            - asset
            - estimated_time
            - location
            - parts
            - times
            - time_items
            - expenditures
            - extra_fields
            - part_extra_fields
            - asset_extra_fields
            - location_extra_fields
      - name: useSequentialId
        schema:
          type: boolean
          description: Whether to use the sequential ID instead of the global ID
        in: query
      responses:
        '200':
          description: Successfully retrieved workOrder's information
          content:
            application/json:
              schema:
                type: object
                required:
                - workOrder
                properties:
                  workOrder:
                    type: object
                    required:
                    - updatedAt
                    - status
                    - title
                    - createdAt
                    - creatorId
                    - id
                    - sequentialId
                    - organizationId
