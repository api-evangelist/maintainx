                            type: integer
                            description: Quantity of parts reserved for work orders
                            example: 3
                          staged:
                            type: integer
                            description: Quantity of parts that have been staged for work orders
                            example: 2
                      assignedQuantity:
                        type: integer
                        description: Total quantity currently assigned to work orders across all stages.
                        example: 10
                      maximumQuantity:
                        type: integer
                        nullable: true
                        example: 100
                        description: Total maximum quantity to keep in stock. Null when no part location has a max set. If your plan includes multi-location parts, this is the quantity across all part locations.
                      vendorIds:
                        type: array
                        items:
                          type: integer
                        example:
                        - 23
                        - 56
                        description: 'List of vendor IDs. Deprecated: Use the `vendorId` field inside `vendors`.'
                        deprecated: true
                      thumbnail:
                        type: object
                        title: attachment
                        required:
                        - id
                        - mimeType
                        - fileName
                        - url
                        - createdAt
                        properties:
                          id:
                            type: number
                            description: Global ID of the attachment
                            example: 12345
                          mimeType:
                            type: string
                            description: MIME type of the file
                            example: image/png
                          fileName:
                            type: string
                            description: Attachment's file name
                            example: image.png
                          url:
                            type: string
                            description: Url of the file. Valid for 60 minutes.
                            example: http://example.com/image.png
                          createdAt:
                            type: string
                            format: date-time
                            description: Date & time at which the attachment was uploaded
                            example: '2022-01-01T00:00:00.000Z'
                          width:
                            type: number
                            description: Width if the file is an image
                            nullable: true
                            example: 220
                          height:
                            type: number
                            description: Height if the file is an image
                            nullable: true
                            example: 100
                        nullable: true
                      attachments:
                        type: array
                        title: attachment
                        description: List of attachments linked to the part
                        items:
                          type: object
                          title: attachment
                          required:
                          - id
                          - mimeType
                          - fileName
                          - url
                          - createdAt
                          properties:
                            id:
                              type: number
                              description: Global ID of the attachment
                              example: 12345
                            mimeType:
                              type: string
                              description: MIME type of the file
                              example: image/png
                            fileName:
                              type: string
                              description: Attachment's file name
                              example: image.png
                            url:
                              type: string
                              description: Url of the file. Valid for 60 minutes.
                              example: http://example.com/image.png
                            createdAt:
                              type: string
                              format: date-time
                              description: Date & time at which the attachment was uploaded
                              example: '2022-01-01T00:00:00.000Z'
                            width:
                              type: number
                              description: Width if the file is an image
                              nullable: true
                              example: 220
                            height:
                              type: number
                              description: Height if the file is an image
                              nullable: true
                              example: 100
                      createdAt:
