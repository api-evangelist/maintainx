      requestBody:
        description: Purchase Order status to update. Optionally include a reviewNote when declining a purchase order to provide feedback for revision.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  example: APPROVED
                  enum:
                  - APPROVED
                  - CANCELED
                  - COMPLETED
                  - DECLINED
                  - PARTIALLY_FULFILLED
                  - PENDING
                  description: 'Here is a list of valid status transitions:

                    | Current Status       | Allowed Transitions                       | Description                                           |

                    |---------------------|------------------------------------------|-------------------------------------------------------|

                    | `REQUESTED`         | `CANCELED` `DECLINED` `PENDING`          | Initial state when PO is first created                |

                    | `PENDING`           | `APPROVED` `CANCELED` `DECLINED`         | PO is awaiting approval                               |

                    | `DECLINED`          | `CANCELED` `PENDING`                     | PO was rejected and needs revision                    |

                    | `APPROVED`          | `CANCELED` or start receiving items      | PO is approved and items can be received              |

                    | `PARTIALLY_FULFILLED`| `COMPLETED`                             | Some items have been received                         |

                    | `CANCELED`          | None                                     | PO has been canceled and cannot be modified           |

                    | `COMPLETED`         | `PARTIALLY_FULFILLED`                    | All items have been received                          |


                    *Notes*:

                    - Status changes trigger notifications to relevant users and vendors

                    - You can subscribe to status changes using [webhooks](#tag/Subscriptions-and-Webhooks)

                    - The `DECLINED` status is displayed as ''Rejected'' in the application interface

                    - Moving to `PARTIALLY_FULFILLED` happens automatically when items are received

                    - Use the optional `reviewNote` field to provide feedback when declining a purchase order'
                reviewNote:
                  type:
                  - string
                  - 'null'
                  description: Notes to be left for changes to be made when sending a Purchase Order for revision
                  example: Please adjust quantities and resubmit
