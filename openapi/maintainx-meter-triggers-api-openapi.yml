  PART_QUANTITY_CHANGE:
    post:
      summary: Part Quantity Changed
      security: []
      description: ''
      tags:
      - Subscriptions & Webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - partId
              - orgId
              - quantityDiff
              - locations
              - occurredAt
              properties:
                partId:
                  type: number
                  description: Global ID of the part
                  example: 123456
                orgId:
                  type: number
                  description: Global ID of the organization
                  example: 321
                quantityDiff:
                  type: number
                  description: Number of units added to the part across all locations, negative values represents units removed from the part
                  example: 3
                oldQuantity:
                  type: number
                  description: Total number of units on the part across all locations before the transaction (if available)
                  example: 54
                newQuantity:
                  type: number
                  description: Total number of units on the part across all locations after the transaction (if available)
                  example: 57
                userId:
                  type: number
                  description: Global ID of the user that made a change
                  example: 1337
                triggeredFrom:
                  type: string
                  description: Origin of the part quantity change
                  enum:
                  - PURCHASE_ORDER
                  - WORK_ORDER
                  - MANUAL_RESTOCK
                  - PART_TRANSFER
                  - CYCLE_COUNT
                  example: PURCHASE_ORDER
                locations:
                  type: array
                  description: List of locations where the part quantity was changed
                  items:
                    type: object
                    required:
                    - locationId
                    - quantityDiff
                    properties:
                      locationId:
                        type: number
                        description: Global ID of the location
                        example: 842
                      quantityDiff:
                        type: number
                        description: Number of units added to the part in this location, negative values represents units removed from the part
                        example: 3
                      oldQuantity:
                        type: number
                        description: Total number of units on the part at this location before the transaction (if available)
                        example: 3
                      newQuantity:
                        type: number
                        description: Total number of units on the part at this location after the transaction (if available)
                        example: 3
                occurredAt:
                  type: string
                  format: date-time
                  description: Date & time at which the part quantity was changed
                  example: '2022-01-01T00:00:00.000Z'
      operationId: PART_QUANTITY_CHANGE
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
  PART_TRANSFER:
    post:
      summary: Part Transfer
      security: []
      description: "This webhook is triggered when a part is transferred from one organization to another. Subscriptions can be created for the following scenarios:\n  - When a transfer request is approved\n  - When the transfer is fulfilled\n  - When an approved transfer is canceled\n  - When a part is transferred instantly\n  If you use the \"Part Quantity Change\" webhook, there is a possibility of double accounting.\n  "
      tags:
      - Subscriptions & Webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - triggeredFrom
              - userId
              - quantity
              - sourceData
              - destinationData
              - triggeredAt
              properties:
                triggeredFrom:
                  type: string
                  description: Origin of the part transfer
                  enum:
                  - REQUEST_APPROVAL
                  - FULFILLMENT_APPROVAL
                  - FULFILLMENT_CANCELLATION
                  - INSTANT_TRANSFER
                  example: REQUEST_APPROVAL
                transferRequestId:
                  type: number
                  description: Global ID of the part transfer request
                  example: 123456
                userId:
                  type: number
                  description: Global ID of the user that approved the trigger
                  example: 1337
                totalQuantity:
                  type: number
                  description: Number of transferred units (across all locations)
                  example: 3
                sourceData:
                  type: object
                  description: Properties related to the source organization
                  required:
                  - partId
                  - orgId
                  properties:
                    partId:
                      type: number
                      description: Global ID of the part from the source organization
                      example: 123456
                    partUnitCost:
                      type: number
                      description: Unit cost of the part
                      example: 100
                    orgId:
                      type: number
                      description: Global ID of the organization that is transferring the part
                      example: 321
                    locationId:
                      type: number
                      description: Global ID of the location that is transferring the part
                      example: 842
                destinationData:
                  type: object
                  description: Properties related to the destination organization
                  required:
                  - partId
                  - orgId
                  properties:
                    partId:
                      type: number
                      description: Global ID of the part from the destination organization
                      example: 123456
                    orgId:
                      type: number
                      description: Global ID of the organization that is receiving the part
                      example: 321
                    locations:
                      type: array
                      description: List of locations where the part was transferred
                      items:
                        type: object
                        properties:
                          locationId:
                            type: number
                            description: Global ID of the location that is receiving the part
                            example: 842
                          locationQuantity:
                            type: number
                            description: Number of units transferred to this location
                            example: 3
                triggeredAt:
                  type: string
                  format: date-time
                  description: Date & time at which the trigger was approved
                  example: '2022-01-01T00:00:00.000Z'
      operationId: PART_TRANSFER
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
