  /metertriggers/{id}/workordertemplates:
    patch:
      summary: Update Meter Trigger's Work Order Template
      parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: ID of the work order template
        example: '1'
      - schema:
          type: boolean
        description: Set `skipWebhook=true`, `skipWebhook=1` or `skipWebhook=yes` to skip all webhooks upon successful operation on the endpoint. [Learn more about webhooks](#tag/Subscriptions-and-Webhooks)
        name: skipWebhook
        in: query
        required: false
      requestBody:
        description: Data to update a work order template
        content:
          application/json:
            schema:
              type: object
              properties:
                procedureTemplateId:
                  nullable: true
                  type: integer
                  description: ID of the procedure template used
                saveProcedureAsTemplate:
                  type: boolean
                  nullable: true
                  description: Save the procedure in data as a new procedure template
                title:
                  type: string
                  description: Title of the work order that will be generated. Same string for meter trigger's name. Setting this will also set the corresponding meter's trigger name.
                data:
                  type: object
                  properties:
                    assetId:
                      nullable: true
                      type: integer
                    assigneeIds:
                      type: array
                      description: Users IDs assigned to the template
                      items:
                        type: number
                        example: 1
                    description:
                      nullable: true
                      type: string
                      example: A work order sample description
                    dueDate:
                      type: object
                      nullable: true
                      properties:
                        type:
                          type: string
                          enum:
                          - OFFSET
                        offset:
                          type: number
                    locationId:
                      nullable: true
                      type: integer
                      description: Global ID of the location assigned to the work order
                    partsUsed:
                      type: array
                      nullable: true
                      items:
                        type: object
                        properties:
                          partId:
                            type: integer
                            example: 963
                            description: Global ID of the part
                          quantityUsed:
                            type: integer
                            description: Quantity used in the work order.
                            example: 120
                          locationId:
                            type: integer
                            nullable: true
                            description: Global ID of the location of the part
                            example: 852
                          copyOnRecurring:
                            type: string
                            description: Indicates if the parts will be copied to the next work order in the chain (if applicable).
                            default: Default
                            enum:
                            - NoCopy
                            - Copy
                            - Default
                    priority:
                      type: string
                      example: MEDIUM
                      enum:
                      - NONE
                      - LOW
                      - MEDIUM
                      - HIGH
                    procedure:
                      type: object
                      nullable: true
                      required:
                      - title
                      - fields
                      properties:
                        id:
                          type: number
                          example: 1234
                          deprecated: true
                          description: You should favor 'procedureTemplateId' to attach a procedure template.
                        title:
                          type: string
                          description: Title of the procedure
                          example: Control dashboard audit
                        fields:
                          type: array
                          items:
                            type: object
                            required:
                            - type
                            - label
                            properties:
                              label:
                                type: string
                                example: 'Metal Parts: broken, loose, dented, rusty, missing'
                              type:
                                type: string
                                example: INSPECTION_CHECK
                                enum:
                                - NUMBER
                                - AMOUNT
                                - TEXT
                                - UNSUPPORTED
                                - HEADING
                                - FILE
                                - SIGNATURE
                                - MULTIPLE_CHOICE
                                - INSPECTION_CHECK
                                - YES_NO_NA
                                - CHECKBOX
                                - CHECKLIST
                                - METER
                                - DATE
                                - CYCLE_COUNT
                              description:
                                type: string
                                nullable: true
                              choices:
                                type: array
                                items:
                                  example: Partially
                                  type: string
                              urls:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - link
                                  properties:
                                    label:
                                      type: string
                                      description: Label of the url
                                      example: MaintainX Website
                                    link:
                                      type: string
                                      description: Link
                                      example: www.getmaintainx.com
                              meterId:
                                type: number
                                example: 1
                                nullable: true
                                description: Id of the meter
                              isDateAndTime:
                                type: boolean
                                default: false
                                description: Indicate if a DATE field also contains the time
                                example: false
                              index:
                                type: number
                                example: 1
                                description: Order which the row is displayed
                          description: Steps of a procedure
                    tagsIds:
                      type: array
                      description: Categories IDs
                      items:
                        type: number
                        example: 1
                    teamIds:
                      type: array
                      description: Teams IDs
                      items:
                        type: number
                        example: 1
                    title:
                      type: string
                      deprecated: true
                      description: Use the `title` field at the root level. If both `title` and `data.title` are provided, `title` will be used.
                    vendorIds:
                      type: array
                      description: Vendor IDs
                      items:
                        type: number
                        example: 1
      responses:
        '204':
          description: Successfully edited the procedure template
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                example:
                  errors:
                  - error: Bad request
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - error
                      properties:
                        error:
                          type: string
                        fieldPath:
                          nullable: true
                          type: string
                        fieldValue:
                          nullable: true
                          oneOf:
                          - type: string
                          - type: number
                          - type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Could not find the specified work order template.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: work order template Not Found
      tags:
      - Meter Triggers
