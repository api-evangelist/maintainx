                  type: string
                  format: date-time
                  description: Date & time at which the event occurred
                  example: '2022-01-01T00:00:00.000Z'
                sourceIp:
                  type: string
                  description: IP address of the client
                  example: 203.0.113.42
                countryName:
                  type: string
                  description: Country derived from the client IP via CloudFront
                  example: United States
                regionName:
                  type: string
                  description: Region/state derived from the client IP via CloudFront
