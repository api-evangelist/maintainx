openapi: 3.2.0
info:
  title: Maintainx Subscriptions & Webhooks API
  version: '1'
  contact:
    url: https://www.getmaintainx.com/
    name: Support
    email: support@getmaintainx.com
  x-logo:
    url: https://maintainx-static.s3-us-west-2.amazonaws.com/img/default-org-logo.png
    backgroundColor: '#FFFFFF'
    altText: MaintainX logo
  description: 'Operations tagged Subscriptions & Webhooks across 2 of this provider''s published API definitions: maintainx-openapi-original.json, maintainx-subscriptions-webhooks-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.getmaintainx.com/v1
  description: Endpoint
security:
- Bearer: []
tags:
- name: Subscriptions & Webhooks
  description: 'Webhooks in MaintainX


    What are Webhooks?'
  x-traitTag: false
paths:
  /subscriptions:
    post:
      summary: Create new subscription
      requestBody:
        description: Subscription to create
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
              - title: API Token Created
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - API_TOKEN_CREATED
                    example: API_TOKEN_CREATED
                  url:
                    type: string
                    example: https://example.com
              - title: API Token Revoked
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - API_TOKEN_REVOKED
                    example: API_TOKEN_REVOKED
                  url:
                    type: string
                    example: https://example.com
              - title: Asset Status Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - ASSET_STATUS_CHANGE
                    example: ASSET_STATUS_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfAssetStatusTypes:
                        type: array
                        description: Asset status types that will trigger the webhook
                        items:
                          title: Status
                          type: string
                          enum:
                          - IGNORE
                          - OFFLINE
                          - ONLINE
                      oneOfCustomAssetStatusesIds:
                        type: array
                        description: Custom status ids that will trigger the webhook
                        items:
                          type: number
              - title: Connector Token Revoked
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - CONNECTOR_TOKEN_REVOKED
                    example: CONNECTOR_TOKEN_REVOKED
                  url:
                    type: string
                    example: https://example.com
              - title: Data Export Initiated
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - DATA_EXPORT_INITIATED
                    example: DATA_EXPORT_INITIATED
                  url:
                    type: string
                    example: https://example.com
              - title: Invite Link Archived
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - INVITE_LINK_ARCHIVED
                    example: INVITE_LINK_ARCHIVED
                  url:
                    type: string
                    example: https://example.com
              - title: Invite Link Created
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - INVITE_LINK_CREATED
                    example: INVITE_LINK_CREATED
                  url:
                    type: string
                    example: https://example.com
              - title: Invite Link Updated
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - INVITE_LINK_UPDATED
                    example: INVITE_LINK_UPDATED
                  url:
                    type: string
                    example: https://example.com
              - title: Meter Trigger Status Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - METER_TRIGGER_STATE_CHANGE
                    example: METER_TRIGGER_STATE_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfStates:
                        type: array
                        description: States that will trigger the webhook.
                        items:
                          title: State
                          type: string
                          enum:
                          - INACTIVE
                          - INSUFFICIENT_DATA
                          - PENDING
                          - STABLE
                          - TRIGGERED
              - title: New Asset
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_ASSET
                    example: NEW_ASSET
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the Asset data
              - title: New Category on Work Order
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_CATEGORY_ON_WORK_ORDER
                    example: NEW_CATEGORY_ON_WORK_ORDER
                  url:
                    type: string
                    example: https://example.com
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfCategories:
                        type: array
                        description: At least one of those categories should be on the work order to trigger the webhook.
                        items:
                          oneOf:
                          - title: Name
                            type: string
                            description: Category name
                          - title: ID
                            type: integer
                            description: Global ID of a category
              - title: New Comment on Work Order
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_COMMENT_ON_WORK_ORDER
                    example: NEW_COMMENT_ON_WORK_ORDER
                  url:
                    type: string
                    example: https://example.com
              - title: New Location
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_LOCATION
                    example: NEW_LOCATION
                  url:
                    type: string
                    example: https://example.com
              - title: New Part
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_PART
                    example: NEW_PART
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the Part data
              - title: New Purchase Order
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_PURCHASE_ORDER
                    example: NEW_PURCHASE_ORDER
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the Purchase Order data
                      includeOAuthTokensInPayload:
                        type: boolean
                        description: 'If true, the webhook payload will include the OAuth tokens of the user whose action triggered the webhook. Warning: these tokens are sensitive and should only be included when the webhook is sent to a trusted source. Only available when OIDC login is enabled for the organization.'
              - title: New Request
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_WORK_REQUEST
                    example: NEW_WORK_REQUEST
                  url:
                    type: string
                    example: https://example.com
              - title: New Slash Command
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_SLASH_COMMAND
                    example: NEW_SLASH_COMMAND
                  url:
                    type: string
                    example: https://example.com
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      command:
                        type: string
                        description: Specify the required keyword to trigger the Webhook.
                        example: jira
              - title: New Vendor
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_VENDOR
                    example: NEW_VENDOR
                  url:
                    type: string
                    example: https://example.com
              - title: New Work Order
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - NEW_WORK_ORDER
                    example: NEW_WORK_ORDER
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the Work Order data
              - title: Part Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - PART_CHANGE
                    example: PART_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the part data
                      onlySerializeFilteredProperties:
                        type: boolean
                        description: If true and serializeEntity is also set to true, only the filtered properties will be returned on update.
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfPartProperties:
                        type: array
                        description: Properties that will trigger the webhook. <br>*If no properties are selected, the webhook will be triggered on every change
                        items:
                          title: Properties
                          type: string
                          enum:
                          - AREA
                          - ASSETS
                          - AVAILABLE_QUANTITY
                          - BARCODE
                          - DESCRIPTION
                          - EXTRA_FIELDS
                          - LOCATION
                          - LOCATIONS
                          - MAXIMUM_QUANTITY
                          - MINIMUM_QUANTITY
                          - NAME
                          - PART_TYPES
                          - TEAMS
                          - UNIT_COST
                          - VENDORS
              - title: Part Delete
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - PART_DELETE
                    example: PART_DELETE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the part data
              - title: Part Quantity Changed
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - PART_QUANTITY_CHANGE
                    example: PART_QUANTITY_CHANGE
                  url:
                    type: string
                    example: https://example.com
              - title: Part Transfer
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - PART_TRANSFER
                    example: PART_TRANSFER
                  url:
                    type: string
                    example: https://example.com
              - title: Purchase Order Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - PURCHASE_ORDER_CHANGE
                    example: PURCHASE_ORDER_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the purchase order data
                      onlySerializeFilteredProperties:
                        type: boolean
                        description: If true and serializeEntity is also set to true, only the filtered properties will be returned on update.
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfPurchaseOrderProperties:
                        type: array
                        description: Properties that will trigger the webhook. <br>*If no properties are selected, the webhook will be triggered on every changes
                        items:
                          title: Properties
                          type: string
                          enum:
                          - ATTACHMENTS
                          - BILLING_ADDRESS
                          - COSTS
                          - DUE_DATE
                          - EXTRA_FIELDS
                          - ITEMS
                          - NOTE
                          - OVERRIDE_NUMBER
                          - SHIPPING_ADDRESS
                          - STATUS
                          - TITLE
                          - VENDOR
                          - VENDOR_CONTACTS
              - title: Purchase Order Status Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - PURCHASE_ORDER_STATUS_CHANGE
                    example: PURCHASE_ORDER_STATUS_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializePurchaseOrder:
                        type: boolean
                        description: If true, the webhook will receive the purchase order data
                      omitSendToVendorPopup:
                        type: boolean
                        description: If true, if the state change was done from the UI, the UI will not prompt the user to send the purchase order to the vendor. It will be assumed that the webhook took care of it.
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfStatuses:
                        type: array
                        description: Statuses that will trigger the webhook
                        items:
                          title: Status
                          type: string
                          enum:
                          - APPROVED
                          - CANCELED
                          - COMPLETED
                          - DECLINED
                          - PARTIALLY_FULFILLED
                          - PENDING
                          - REQUESTED
                      vendors:
                        type: array
                        description: Vendors id that will trigger the webhook
                        items:
                          type: number
              - title: Role Archived
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - ROLE_ARCHIVED
                    example: ROLE_ARCHIVED
                  url:
                    type: string
                    example: https://example.com
              - title: Role Created
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - ROLE_CREATED
                    example: ROLE_CREATED
                  url:
                    type: string
                    example: https://example.com
              - title: Role Updated
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - ROLE_UPDATED
                    example: ROLE_UPDATED
                  url:
                    type: string
                    example: https://example.com
              - title: SSO Configuration Changed
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - SSO_CONFIG_CHANGED
                    example: SSO_CONFIG_CHANGED
                  url:
                    type: string
                    example: https://example.com
              - title: User Activated
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_ACTIVATED
                    example: USER_ACTIVATED
                  url:
                    type: string
                    example: https://example.com
              - title: User Invited
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_INVITED
                    example: USER_INVITED
                  url:
                    type: string
                    example: https://example.com
              - title: User Login Failure
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_LOGIN_FAILURE
                    example: USER_LOGIN_FAILURE
                  url:
                    type: string
                    example: https://example.com
              - title: User Login Success
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_LOGIN_SUCCESS
                    example: USER_LOGIN_SUCCESS
                  url:
                    type: string
                    example: https://example.com
              - title: User Logout
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_LOGOUT
                    example: USER_LOGOUT
                  url:
                    type: string
                    example: https://example.com
              - title: User Permissions Changed
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_PERMISSIONS_CHANGED
                    example: USER_PERMISSIONS_CHANGED
                  url:
                    type: string
                    example: https://example.com
              - title: User Removed
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_REMOVED
                    example: USER_REMOVED
                  url:
                    type: string
                    example: https://example.com
              - title: User Role Changed
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_ROLE_CHANGED
                    example: USER_ROLE_CHANGED
                  url:
                    type: string
                    example: https://example.com
              - title: User Session Revoked
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - USER_SESSION_REVOKED
                    example: USER_SESSION_REVOKED
                  url:
                    type: string
                    example: https://example.com
              - title: Webhook Archived
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WEBHOOK_ARCHIVED
                    example: WEBHOOK_ARCHIVED
                  url:
                    type: string
                    example: https://example.com
              - title: Webhook Created
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WEBHOOK_CREATED
                    example: WEBHOOK_CREATED
                  url:
                    type: string
                    example: https://example.com
              - title: Work Order Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WORK_ORDER_CHANGE
                    example: WORK_ORDER_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the work order data
                      onlySerializeFilteredProperties:
                        type: boolean
                        description: If true and serializeEntity is also set to true, only the filtered properties will be returned on update.
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfProperties:
                        type: array
                        description: Properties that will trigger the webhook. <br>*If no properties are selected, the webhook will be triggered on every changes
                        items:
                          title: Properties
                          type: string
                          enum:
                          - ASSET
                          - ASSIGNEES
                          - CATEGORIES
                          - COSTS
                          - DESCRIPTION
                          - DUE_DATE
                          - ESTIMATED_TIME
                          - EXTRA_FIELDS
                          - LOCATION
                          - PARTS
                          - PRIORITY
                          - START_DATE
                          - TEAMS
                          - TITLE
                          - VENDORS
              - title: Work Order Delete
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WORK_ORDER_DELETE
                    example: WORK_ORDER_DELETE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the work order data
              - title: Work Order Overdue
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WORK_ORDER_OVERDUE
                    example: WORK_ORDER_OVERDUE
                  url:
                    type: string
                    example: https://example.com
              - title: Work Order Part Status Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WORK_ORDER_PART_STATUS_CHANGE
                    example: WORK_ORDER_PART_STATUS_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the work order data
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfPartStatuses:
                        type: array
                        description: Part status that will trigger the webhook. If empty or omitted, triggers for all part status changes.
                        items:
                          title: Part Status
                          type: string
                          enum:
                          - no_parts
                          - assigned
                          - reserved
                          - kitted
                          - staged
                          - issued
              - title: Work Order Status Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WORK_ORDER_STATUS_CHANGE
                    example: WORK_ORDER_STATUS_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  options:
                    type: object
                    description: Possible options
                    properties:
                      serializeEntity:
                        type: boolean
                        description: If true, the webhook will receive the work order data
                      includeOAuthTokensInPayload:
                        type: boolean
                        description: 'If true, the webhook payload will include the OAuth tokens of the user whose action triggered the webhook. Warning: these tokens are sensitive and should only be included when the webhook is sent to a trusted source. Only available when OIDC login is enabled for the organization.'
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfStatuses:
                        type: array
                        description: Statuses that will trigger the webhook.<br> Note, that `"CANCELED"` and `"SKIPPED"` statuses are only available if this feature is enabled in your organization.
                        items:
                          title: Status
                          type: string
                          enum:
                          - OPEN
                          - IN_PROGRESS
                          - ON_HOLD
                          - DONE
                          - CANCELED
                          - SKIPPED
              - title: Work Request Status Change
                type: object
                required:
                - type
                - url
                properties:
                  type:
                    type: string
                    description: Type of event subscribed to
                    enum:
                    - WORK_REQUEST_STATUS_CHANGE
                    example: WORK_REQUEST_STATUS_CHANGE
                  url:
                    type: string
                    example: https://example.com
                  filters:
                    type: object
                    description: Possible filters.
                    properties:
                      oneOfStatuses:
                        type: array
                        description: Statuses that will trigger the webhook.
                        items:
                          title: Status
                          type: string
                          enum:
                          - APPROVED
                          - DONE
                          - REJECTED
      responses:
        '201':
          description: Successfully created subscription
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: integer
                    example: 963
                    description: Global ID of the subscription
                  status:
                    type: string
                    description: Validation status of the subscription. Contact support if your subscription returns PENDING_APPROVAL before using the subscription.
                    enum:
                    - VALID
                    - PENDING_APPROVAL
                  secret:
                    type: string
                    description: Secret to hash the Hmac signature
        '400':
          description: OrganizationId was not provided
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                example:
                  errors:
                  - error: Missing x-organization-id header.
                properties:
