  WORK_ORDER_CHANGE:
    post:
      summary: Work Order Change
      security: []
      description: 'The only properties triggering the webhook when changed, are the following: ASSET, ASSIGNEES, CATEGORIES, COSTS, DESCRIPTION, DUE_DATE, ESTIMATED_TIME, EXTRA_FIELDS, LOCATION, PARTS, PRIORITY, START_DATE, TEAMS, TITLE, VENDORS'
      tags:
      - Subscriptions & Webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - workOrderId
              - orgId
              - occurredAt
              properties:
                workOrderId:
                  type: number
                  description: Global ID of the work order
                  example: 123456
                orgId:
                  type: number
                  description: Global ID of the organization
                  example: 321
                occurredAt:
                  type: string
                  format: date-time
                  description: Date & time at which the trigger occurred
                  example: '2022-01-01T00:00:00.000Z'
                newWorkOrder:
                  type: object
                  description: Properties of the updated work order
                  properties:
                    assetId:
                      type:
                      - integer
                      - 'null'
                      example: 42
                    assigneeIds:
                      type: array
                      description: List of user ids assigned to the work order
                      items:
                        type: integer
                        example: 31
                    categories:
                      type: array
                      description: Newly added categories on the work order
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: number
                            description: Global ID of the category
                            example: 123
                          name:
                            type: string
                            description: Label of the category
                            example: Safety
                          description:
                            type: string
                            example: Used for everything related to Safety
                            description: Description field for additional information.
                    description:
                      type:
                      - string
                      - 'null'
                      example: A work order sample description
                    dueDate:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: Date & time at which the work order is due
                      example: '2022-01-01T00:00:00.000Z'
                    estimatedTime:
                      type:
                      - integer
                      - 'null'
                      description: The estimated time taken in seconds to complete the work order
                      example: 3600
                    extraFields:
                      type: object
                      description: 'Custom Fields on the entity. The object keys are the exact Custom Field labels, including spaces or special characters. (ie: "Third Party Id")'
                      additionalProperties:
                        type: string
                      example:
                        Third Party Id: aa674f49-dac6-4f15-9fdd-061d2b5caf30
                    locationId:
                      type:
                      - integer
                      - 'null'
                      description: Global ID of the location assigned to the work order
                      example: 611
                    parts:
                      type: array
                      description: Parts attached to the Work Order
                      items:
                        type: object
                        required:
                        - id
                        - quantityUsed
                        - copyOnRecurring
                        properties:
                          id:
                            type: integer
                            example: 963
                            description: Global ID of the part
                          quantityUsed:
                            type: integer
                            description: Quantity used in the work order.
                            example: 2
                          unitCost:
                            type:
                            - integer
                            - 'null'
                            description: Cost in cents. For example, for $1.20, put 120
                            example: 120
                          locationId:
                            type:
                            - integer
                            - 'null'
                            description: Global ID of the location of the part.
                            example: 852
                          copyOnRecurring:
                            type: string
                            description: Indicates if the parts will be copied to the next work order in the chain (if applicable).
                            default: Default
                            enum:
                            - NoCopy
                            - Copy
                            - Default
                    priority:
                      type: string
                      example: MEDIUM
                      enum:
                      - NONE
                      - LOW
                      - MEDIUM
                      - HIGH
                    startDate:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: Date & time at which the work order will show up in the inbox</br>Only valid when <b>dueDate</b> is set
                      example: '2022-01-01T00:00:00.000Z'
                    teamIds:
                      type: array
                      description: List of team ids assigned to the work order
                      items:
                        type: integer
                        example: 12
                    title:
                      type: string
                    vendorIds:
                      type: array
                      description: Vendor IDs
                      items:
                        type: number
                        example: 1
                    costs:
                      type: object
                      required:
                      - total
                      - rows
                      properties:
                        total:
                          description: Total cost in cents of the Work order
                          type: number
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: Type of the entry
                                enum:
                                - EXPENSE
                                - PART
                                - TIME
                              costPerUnit:
                                type:
                                - number
                                - 'null'
                                description: Cost per part in cents or cents per hour
                              description:
                                type:
                                - string
                                - 'null'
                                description: 'Description of the expense or part description '
                              quantity:
                                type: number
                                description: Number of parts or number of hours
                              rowTotal:
                                type: number
                                description: Total cost in cents
                              durationTotal:
                                type: number
                                description: Total duration in seconds
                              userId:
                                type:
                                - integer
                                - 'null'
                                description: ID of the user who logged the time entry
                              partId:
                                type:
                                - integer
                                - 'null'
                                description: ID of the part used in this cost entry
                addedAssigneeIds:
                  type: array
                  description: User IDs that were added as assignees in this change (only present when assignees changed)
                  items:
                    type: integer
                removedAssigneeIds:
                  type: array
                  description: User IDs that were removed as assignees in this change (only present when assignees changed)
                  items:
                    type: integer
                addedTeamIds:
                  type: array
                  description: Team IDs that were added in this change (only present when teams changed)
                  items:
                    type: integer
                removedTeamIds:
                  type: array
                  description: Team IDs that were removed in this change (only present when teams changed)
                  items:
                    type: integer
      operationId: WORK_ORDER_CHANGE
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
    servers:
    - url: https://api.getmaintainx.com/v1
      description: Endpoint
