- aid: maintainx:maintainx-subscriptions-webhooks-api
  name: MaintainX Subscriptions & Webhooks API
  description: >-
    <h1>Webhooks in MaintainX</h1>


    <h2>What are Webhooks?</h2>

    <p>Webhooks are HTTP callbacks that allow different systems to communicate with each other in real-time.
    They're like automated messengers that deliver information when something happens, rather than requiring
    you to ask for it.</p>


    <p>In the context of MaintainX, webhooks are a way for our system to automatically notify your application
    when specific events occur in your account. Instead of your application repeatedly checking our API
    for updates (a process known as "polling"), webhooks allow you to receive real-time notifications
    about important events like:</p>

    <ul>
      <li>Work order status changes</li>
      <li>New work orders being created</li>
      <li>Asset updates</li>
      <li>And more...</li>
    </ul>


    <p>When an event occurs, MaintainX sends an HTTP POST request to the endpoint you specify. The request
    contains details about the event. It allows your application to react immediately to changes in MaintainX.</p>


    <h2>Set Up Webhooks</h2>

    <p>You can configure webhooks the following ways:</p>


    <h3>From the MaintainX Web Application</h3>

    <p>For a quick setup, you can configure webhooks in the MaintainX web application:</p>

    <ol>
      <li>From the sidebar, select <code>Settings > Integrations</code>. Then, on the Integrations page,
    select <code>Webhooks</code></li>
      <li>Click <b>+ New Webhook</b></li>
      <li>Configure a webhook endpoint and select the events you want to receive</li>
      <li>Save the configuration</li>
    </ol>


    <h3>Via the REST API</h3>

    <p>You can configure webhooks using our REST API if you want to integrate with MaintainX in a programmatic
    way. The API allows you to:</p>

    <ul>
      <li>Create new webhook subscriptions.</li>
      <li>Update webhook configurations.</li>
      <li>Delete webhook subscriptions.</li>
      <li>Retrieve webhook secrets.</li>
    </ul>


    <div class="warning-box">
      <strong>⚠️ Warning</strong>

      Webhooks that don't get a successful response from your application over long periods of time might
    be deleted. A webhook call will timeout after 10 seconds.
      When a webhook is deleted, we send an email to the address linked to the user account that made
    the request.
    </div>


    <h2>Security and Verification</h2>

    <p>To verify that webhook requests come from MaintainX and haven't been tampered with, we include
    security signatures in each webhook request. This section explains how to verify these signatures.</p>


    <h3>Verify Webhook Signatures</h3>

    <p>All webhook HTTP requests sent by MaintainX include two headers containing a timestamp and an HMAC
    signature that must be validated by your application:</p>

    <ul>
      <li><code>x-maintainx-webhook-body-signature</code></li>
      <li><code>x-maintainx-webhook-uri-signature</code></li>
    </ul>


    <div class="note-box">
      <strong>ℹ️ Note</strong>
      <p>When creating a webhook, you'll receive a secret that should be securely stored on your end.
    This secret is essential for signature verification and can also be accessed later through the MaintainX
    interface if needed.</p>
    </div>


    <p>The timestamp is prefixed by <code>t=</code>. Each signature is prefixed by a scheme version. Scheme
    versions start with <code>v</code>, followed by an integer. The only valid live signature version
    is <code>v1</code>.</p>


    <pre>x-maintainx-webhook-body-signature: t=<b>&lt;timestamp&gt;</b>,v1=<b>&lt;signature&gt;</b></pre>


    <h3>Signature Verification Process</h3>

    <p>MaintainX generates signatures using a hash-based message authentication code (HMAC) with SHA-256.
    Here are the steps to verify a webhook signature:</p>


    <ol>
      <li><b>Extract the timestamp and signatures from the header</b>
        <ol>
          <li>Split the header, using the <code>,</code> character as the separator, to get a list of
    elements.</li>
          <li>Split each element, using the <code>=</code> character as the separator, to get a prefix
    and value pair.
          The value for the prefix <code>t</code> corresponds to the timestamp, and <code>v1</code> corresponds
    to the signature.
          You can discard all other elements.</li>
        </ol>
      </li>

      <li><b>To prepare the signed payload string, concatenate the following:</b>
        <ol>
          <li>The timestamp (as a string)</li>
          <li>The character <code>.</code></li>
          <li>The actual JSON payload (that is, the request body, or the full URI)</li>
        </ol>
        <pre><b>&lt;timestamp&gt;</b>.<b>&lt;stringified payload&gt;</b></pre>
      </li>

      <li><b>Determine the expected signature</b>
        <ol>
          <li>Retrieve the secret for your endpoint. Visit [https://app.getmaintainx.com/settings/integrations](https://app.getmaintainx.com/settings/integrations),
    find the endpoint you want, and select <b>Copy secret</b>.</li>
          <li>Compute an HMAC with the SHA256 hash function.</li>
          <li>Use the endpoint's signing secret as the key.</li>
          <li>Use the <code>signed_payload</code> string as the message.</li>
        </ol>
        <pre>crypto.createHmac("sha256", secret).update('<b>&lt;timestamp&gt;</b>.<b>&lt;stringified payload&gt;</b>',
    "utf8").digest("hex")</pre>
      </li>

      <li><b>Compare the signatures</b>
        <ol>
          <li>Compare the signature in the header to the expected signature.</li>
          <li>For an equality match, compute the difference between the current timestamp and the received
    timestamp.</li>
          <li>Decide whether the difference is within your tolerance. We recommend a tolerance of 5 minutes
    to allow for clock drift and processing delays. Webhooks with timestamps older than your tolerance
    window should be rejected to prevent replay attacks.</li>
        </ol>
      </li>
    </ol>


    <h2>Best Practices</h2>

    <ul>
      <li>Always verify webhook signatures to ensure requests are genuine (see Security and Verification
    section above).</li>
      <li>Return a 2xx status code as quickly as possible to acknowledge receipt (our webhooks will timeout
    after 10 seconds).</li>
      <li>Process webhook events asynchronously after acknowledging receipt.</li>
      <li>Implement proper error handling for failed webhook deliveries.</li>
      <li>Implement retry logic in your application to handle temporary failures.</li>
      <li>Implement idempotency in your webhook handler to prevent duplicate processing of the same event.</li>
      <li>Set up monitoring for your webhook endpoint to detect failures.</li>
      <li>Consider using a webhook testing tool during development to simulate events.</li>
    </ul>


    <h2>Limitations</h2>

    <ul>
      <li>Webhook URLs are currently limited to a maximum of 512 characters</li>
    </ul>


    <h2>Need Help?</h2>

    <p>If you need help implementing webhooks or troubleshooting, contact our Support team from the MaintainX
    web application. From the sidebar, select <strong>Support</strong>, then select <strong>Contact Support</strong>.</p>


