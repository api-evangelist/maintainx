aid: maintainx
name: MaintainX
description: >-
  MaintainX is a mobile-first computerized maintenance management system (CMMS) and enterprise
  asset management (EAM) platform for the industrial and frontline workforce. Teams use it to
  manage work orders, work requests, assets, parts inventory, purchase orders, meters, preventive
  maintenance plans, procedures, inspections, and vendors. The MaintainX REST API v1
  (https://api.getmaintainx.com/v1) exposes all of these entities programmatically with Bearer
  (JWT) API-key authentication, cursor pagination, timestamp-based change polling, documented
  rate limits, and 46 webhook event types for real-time integration. Backed by Bain Capital
  Ventures and Bessemer Venture Partners.
