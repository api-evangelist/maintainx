spec_type: Webhooks
description: MaintainX delivers real-time events via user-configured webhook subscriptions. Subscriptions
  are managed in the web app (Settings > Integrations > Webhooks) or programmatically through the REST
  API /subscriptions endpoints. When a subscribed event occurs MaintainX sends an HTTP POST to the configured
  URL. Each subscription has a signing secret retrievable at GET /subscriptions/{id}/secret for payload
  verification.
delivery:
  transport: HTTP POST
  signing: HMAC signing secret via GET /subscriptions/{id}/secret
  some_events_support_filters: true
management_operations:
- op: POST /subscriptions
  summary: Create a webhook subscription for one event type
- op: GET /subscriptions/{id}
  summary: Retrieve a subscription
- op: PATCH /subscriptions/{id}
  summary: Update a subscription
- op: DELETE /subscriptions/{id}
  summary: Delete a subscription
- op: GET /subscriptions/{id}/secret
  summary: Retrieve the signing secret for payload verification
